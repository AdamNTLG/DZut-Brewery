name: brewmaster_app
description: Application de gestion de brasserie artisanale - Recettes, Matières premières, Brassins
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de données SQLite
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # State Management
  provider: ^6.1.1
  
  # Utilitaires
  intl: ^0.18.1
  uuid: ^4.2.1
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  
  # Formulaires
  reactive_forms: ^16.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Fonts personnalisées (optionnel - utilise les fonts système par défaut)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
